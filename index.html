<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#070806" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sparkle 2" />
    <title>Sparkle 2 Clone</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="description" content="A marble-shooter puzzle game modeled on Sparkle 2: fill the Rune Circle, clear the orbs, recover the five keys." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="ui"></div>
      <button id="fs-btn" class="icon-btn fs-btn" type="button" aria-label="Enter full screen" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="fs-enter" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
          <path class="fs-exit" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" />
        </svg>
      </button>
    </div>
    <div id="rotate-hint" role="status">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="6" width="18" height="30" rx="3" /><path d="M8 30a16 16 0 0 0 16 12l-3-3m3 3-3 3" /></svg>
      <p>Turn your device sideways to play</p>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
